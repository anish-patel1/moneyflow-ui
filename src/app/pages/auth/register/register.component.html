<app-floating-configurator />

<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
  <div class="flex flex-col items-center justify-center">
    <div
      style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
      <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
        <div class="text-center mb-8">
          <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">
            Create Your Money Flow Account
          </div>
          <span class="text-muted-color font-medium">Join us to get started</span>
        </div>

        <div [formGroup]="registerForm">
          <div>
            <label for="username" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
              User Name
            </label>
            <div class="relative mb-6">
              <input pInputText id="username" type="text" formControlName="username" placeholder="Enter username"
                class="w-full md:w-[30rem]" />
              <div *ngIf="submitted && f['username'].errors" class="absolute text-red-500 text-xs mt-1">
                <div *ngIf="f['username'].errors['required']">Username is required</div>
                <div *ngIf="f['username'].errors['minlength']">At least 3 characters</div>
              </div>
            </div>
          </div>

          <div>
            <label for="fullName" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
              Full Name
            </label>
            <div class="relative mb-6">
              <input pInputText id="fullName" type="text" formControlName="fullName" placeholder="Enter full name"
                class="w-full md:w-[30rem]" />
              <div *ngIf="submitted && f['fullName'].errors" class="absolute text-red-500 text-xs mt-1">
                <div *ngIf="f['fullName'].errors['required']">Full name is required</div>
                <div *ngIf="f['fullName'].errors['minlength']">At least 3 characters</div>
              </div>
            </div>
          </div>

          <div>
            <label for="password" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
              Password
            </label>
            <div class="relative mb-6">
              <p-password id="password" formControlName="password" placeholder="Enter password" [toggleMask]="true"
                styleClass="w-full md:w-[30rem]" [fluid]="true" [feedback]="false">
              </p-password>
              <div *ngIf="submitted && f['password'].errors" class="absolute text-red-500 text-xs mt-1">
                <div *ngIf="f['password'].errors['required']">Password is required</div>
                <div *ngIf="f['password'].errors['minlength']">At least 6 characters</div>
              </div>
            </div>
          </div>

          <div>
            <label for="confirmPassword" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
              Confirm Password
            </label>
            <div class="relative mb-8">
              <p-password id="confirmPassword" formControlName="confirmPassword" placeholder="Re-enter password"
                [toggleMask]="true" styleClass="w-full md:w-[30rem]" [fluid]="true" [feedback]="false">
              </p-password>
              <div *ngIf="submitted && f['confirmPassword'].errors" class="absolute text-red-500 text-xs mt-1">
                <div *ngIf="f['confirmPassword'].errors['required']">Confirm password is required</div>
                <div *ngIf="f['confirmPassword'].errors['passwordMismatch']">Passwords do not match</div>
              </div>
            </div>
          </div>

          <p-button label="Register" styleClass="w-full mt-8" (click)="registerUser()"></p-button>

          <div class="text-center mt-4">
            <span class="text-muted-color">Already have an account?</span>
            <a routerLink="/auth/login" class="font-medium text-primary cursor-pointer ml-2">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
