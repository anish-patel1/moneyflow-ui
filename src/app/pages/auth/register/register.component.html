<app-floating-configurator />

<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] p-4 overflow-hidden">
  <div class="flex flex-col items-center justify-center w-full max-w-[32rem]">
    <div class="w-full rounded-[48px] sm:rounded-[56px] p-[0.3rem] bg-[linear-gradient(180deg,var(--primary-color)_10%,transparent_30%)]">
      <div class="w-full bg-surface-0 dark:bg-surface-900 py-10 sm:py-12 px-6 sm:px-12 rounded-[45px] sm:rounded-[53px]">
        <div class="text-center mb-6">
          <div class="inline-flex items-center justify-center mb-3">
            <img [src]="'assets/layout/images/logo-' + (layoutService.isDarkTheme() ? 'white' : 'dark') + '.svg'" alt="Money Flow" class="h-14 w-auto" />
          </div>
          <h1 class="text-2xl sm:text-3xl font-semibold text-color mb-2">
            Create Your Account
          </h1>
          <p class="text-sm text-muted-color m-0">Join Money Flow to get started</p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="registerUser()">
          <div class="mb-4">
            <label for="username" class="block text-color text-sm font-medium mb-1.5">
              User Name
            </label>
            <input pInputText id="username" type="text" formControlName="username" placeholder="Enter username"
              class="w-full" />
            <small *ngIf="submitted && f['username'].errors" class="block text-red-500 text-xs mt-1">
              <span *ngIf="f['username'].errors['required']">Username is required</span>
              <span *ngIf="f['username'].errors['minlength']">At least 3 characters</span>
            </small>
          </div>

          <div class="mb-4">
            <label for="fullName" class="block text-color text-sm font-medium mb-1.5">
              Full Name
            </label>
            <input pInputText id="fullName" type="text" formControlName="fullName" placeholder="Enter full name"
              class="w-full" />
            <small *ngIf="submitted && f['fullName'].errors" class="block text-red-500 text-xs mt-1">
              <span *ngIf="f['fullName'].errors['required']">Full name is required</span>
              <span *ngIf="f['fullName'].errors['minlength']">At least 3 characters</span>
            </small>
          </div>

          <div class="mb-4">
            <label for="password" class="block text-color text-sm font-medium mb-1.5">
              Password
            </label>
            <p-password id="password" formControlName="password" placeholder="Enter password" [toggleMask]="true"
              styleClass="w-full" [fluid]="true" [feedback]="false">
            </p-password>
            <small *ngIf="submitted && f['password'].errors" class="block text-red-500 text-xs mt-1">
              <span *ngIf="f['password'].errors['required']">Password is required</span>
              <span *ngIf="f['password'].errors['minlength']">At least 6 characters</span>
            </small>
          </div>

          <div class="mb-6">
            <label for="confirmPassword" class="block text-color text-sm font-medium mb-1.5">
              Confirm Password
            </label>
            <p-password id="confirmPassword" formControlName="confirmPassword" placeholder="Re-enter password"
              [toggleMask]="true" styleClass="w-full" [fluid]="true" [feedback]="false">
            </p-password>
            <small *ngIf="submitted && f['confirmPassword'].errors" class="block text-red-500 text-xs mt-1">
              <span *ngIf="f['confirmPassword'].errors['required']">Confirm password is required</span>
              <span *ngIf="f['confirmPassword'].errors['passwordMismatch']">Passwords do not match</span>
            </small>
          </div>

          <p-button type="submit" label="Register" styleClass="w-full" (onClick)="registerUser()"></p-button>

          <div class="text-center mt-5 text-sm">
            <span class="text-muted-color">Already have an account?</span>
            <a routerLink="/auth/login" class="font-medium text-primary hover:underline cursor-pointer ml-1.5">Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
