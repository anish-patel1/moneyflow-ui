<app-floating-configurator />

<!-- Loading Interface -->
<ng-container *ngIf="{ waking: isWaking$ | async } as overlay">
    <div *ngIf="overlay.waking" class="fixed inset-0 z-[9999] flex items-center justify-center">

        <div class="absolute inset-0 backdrop-blur-md bg-black/40"></div>

        <div class="mf-card-in relative z-10 flex flex-col items-center gap-4 px-12 py-10 rounded-[28px] border border-white/[0.14] bg-white/[0.07] shadow-[0_24px_64px_rgba(0,0,0,0.4)]">

            <div class="relative w-20 h-20 flex items-center justify-center mb-1">
                <div class="mf-ring-pulse absolute inset-0 rounded-full border-2 opacity-0 border-primary"></div>
                <div class="w-16 h-16 rounded-full flex items-center justify-center animate-pulse bg-primary/10 border-[1.5px] border-primary/30">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 text-primary">
                        <ellipse cx="12" cy="6" rx="8" ry="3" />
                        <path d="M4 6v4c0 1.657 3.582 3 8 3s8-1.343 8-3V6" />
                        <path d="M4 10v4c0 1.657 3.582 3 8 3s8-1.343 8-3v-4" />
                    </svg>
                </div>
            </div>

            <p class="m-0 text-lg font-semibold tracking-tight text-white/90">Just a moment&hellip;</p>
            <p class="m-0 text-xs tracking-tight text-white/50">We&rsquo;re getting everything ready for you.</p>

            <div class="flex items-center gap-2 mt-0.5">
                <span class="w-[7px] h-[7px] rounded-full animate-bounce bg-primary" style="animation-delay:0s"></span>
                <span class="w-[7px] h-[7px] rounded-full animate-bounce bg-primary" style="animation-delay:.15s"></span>
                <span class="w-[7px] h-[7px] rounded-full animate-bounce bg-primary" style="animation-delay:.3s"></span>
            </div>

            <div class="w-44 mt-1">
                <div class="w-full h-[3px] rounded-full overflow-hidden bg-white/10">
                    <div class="mf-progress-bar h-full rounded-full bg-[linear-gradient(90deg,transparent,var(--primary-color),transparent)]"></div>
                </div>
            </div>

        </div>
    </div>
</ng-container>

<!-- Login Form -->
<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] p-4 overflow-hidden">
    <div class="flex flex-col items-center justify-center w-full max-w-[32rem]">
        <div class="w-full rounded-[48px] sm:rounded-[56px] p-[0.3rem] bg-[linear-gradient(180deg,var(--primary-color)_10%,transparent_30%)]">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-10 sm:py-12 px-6 sm:px-12 rounded-[45px] sm:rounded-[53px]">
                <div class="text-center mb-6">
                    <h1 class="text-2xl sm:text-3xl font-semibold text-color mb-2">
                        Welcome to Money Flow
                    </h1>
                    <p class="text-sm text-muted-color m-0">Sign in to continue</p>
                </div>

                <div>
                    <div class="mb-4">
                        <label for="username" class="block text-color text-sm font-medium mb-1.5">
                            User Name
                        </label>
                        <input pInputText id="username" type="text" placeholder="Enter user name"
                            class="w-full" name="username" [(ngModel)]="username" #usernameModel="ngModel"
                            required />
                        <small class="block text-red-500 text-xs mt-1"
                            *ngIf="usernameModel.invalid && usernameModel.touched">
                            Username is required
                        </small>
                    </div>

                    <div class="mb-2">
                        <label for="password" class="block text-color text-sm font-medium mb-1.5">
                            Password
                        </label>
                        <p-password id="password" name="password" [(ngModel)]="password" placeholder="Enter password"
                            [toggleMask]="true" [fluid]="true" [feedback]="false" styleClass="w-full" required #passwordModel="ngModel">
                        </p-password>

                        <small class="block text-red-500 text-xs mt-1"
                            *ngIf="passwordModel.invalid && passwordModel.touched">
                            Password is required
                        </small>
                    </div>

                    <div class="flex justify-end mb-6">
                        <span class="text-sm font-medium text-primary hover:underline cursor-pointer">Forgot password?</span>
                    </div>

                    <ng-container *ngIf="{ waking: isWaking$ | async } as state">
                        <p-button label="Sign In" styleClass="w-full mb-4" (onClick)="login()"
                            [disabled]="!username || !password || !!state.waking" [loading]="btnLoading">
                        </p-button>
                    </ng-container>

                    <div class="text-center text-sm">
                        <span class="text-muted-color">Don't have an account?</span>
                        <a routerLink="/auth/register" class="font-medium text-primary hover:underline cursor-pointer ml-1.5">
                            Register here
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-6 text-sm text-muted-color">
            <span>Version <span class="text-primary font-bold">{{ version }}</span></span>
        </div>
    </div>
</div>
