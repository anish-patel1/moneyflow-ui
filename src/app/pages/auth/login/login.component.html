<app-floating-configurator />

<div
    class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-[100vw] overflow-hidden">
    <div class="flex flex-col items-center justify-center">
        <div
            style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">
                        Welcome to Money Flow
                    </div>
                    <span class="text-muted-color font-medium">Sign in to continue</span>
                </div>

                <div>
                    <label for="username" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
                        User Name
                    </label>
                    <div class="mb-8">
                        <input pInputText id="username" type="text" placeholder="Enter user name" class="w-full md:w-[30rem]"
                            name="username" [(ngModel)]="username" #usernameModel="ngModel" required />
                        <small class="block text-red-500 text-xs mt-1" *ngIf="usernameModel.invalid && usernameModel.touched">
                            Username is required
                        </small>
                    </div>

                    <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">
                        Password
                    </label>
                    <div class="relative mb-6">
                        <p-password id="password" name="password" [(ngModel)]="password" placeholder="Enter password" [toggleMask]="true"
                            [fluid]="true" [feedback]="false" required #passwordModel="ngModel">
                        </p-password>
                    
                        <small class="absolute text-red-500 text-xs mt-1" *ngIf="passwordModel.invalid && passwordModel.touched">
                            Password is required
                        </small>
                    </div>
                
                    <div class="flex justify-end mb-8">
                        <span class="font-medium no-underline cursor-pointer text-primary">Forgot password?</span>
                    </div>
                
                    <p-button label="Sign In" styleClass="w-full mb-4"
                        (onClick)="login()" [disabled]="!username || !password" [loading]="btnLoading">
                    </p-button>
                
                    <div class="text-center">
                        <span class="text-muted-color">Don't have an account?</span>
                        <a routerLink="/auth/register" class="font-medium text-primary cursor-pointer ml-2">
                            Register here
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="mt-8">
            <p>Version<span class="text-primary font-bold ms-2">{{ version }}</span></p>
        </div>
    </div>
</div>
