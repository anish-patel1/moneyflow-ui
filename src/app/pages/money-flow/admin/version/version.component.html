<p-table #table [value]="versionData" dataKey="versionId" [tableStyle]="{ 'min-width': 'auto' }"
    [globalFilterFields]="['version', 'details']" [rows]="5" [paginator]="true"
    [rowsPerPageOptions]="[5, 8, 10, 20, 30]" [rowHover]="true">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" placeholder="Search..." (input)="search(table, $event)" />
            </p-iconfield>
            <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openDialog()" />
        </div>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th style="width: 8rem" pSortableColumn="version">Version
                <p-sortIcon field="version" />
            </th>
            <th style="width: 12rem" pSortableColumn="date">Date
                <p-sortIcon field="date" />
            </th>
            <th pSortableColumn="details">Details
                <p-sortIcon field="details" />
            </th>
            <th style="width: 5rem">Status</th>
            <th style="width: 8rem"></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-data>
        <tr class="hover-row">
            <td>{{ data.version }}</td>
            <td>{{ data.releaseDate }}</td>
            <td>{{ data.details }}</td>
            <td>
                <p-tag [value]="data.statusText" />
            </td>
            <td class="action-icons">
                <div class="icon-group">
                    <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" pTooltip="Edit"
                        tooltipPosition="top" (click)="openEditDialog(data.versionId)" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" pTooltip="Delete"
                        tooltipPosition="top" (click)="btnDelete(data.versionId)" />
                </div>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <ng-container *ngIf="isgridloading">
            <tr *ngFor="let _ of [].constructor(5)">
                <td *ngFor="let _ of [].constructor(4)">
                    <p-skeleton width="100%" height="1.25rem"></p-skeleton>
                </td>
                <td>
                    <div class="flex gap-2">
                        <p-skeleton shape="circle" width="2rem" height="2rem"></p-skeleton>
                        <p-skeleton shape="circle" width="2rem" height="2rem"></p-skeleton>
                    </div>
                </td>
            </tr>
        </ng-container>
        <tr *ngIf="!isgridloading">
            <td colspan="5">
                <div class="flex flex-col items-center justify-center p-6 text-gray-500 animate-fade-in">
                    <i class="pi pi-database text-5xl text-gray-400 mb-3"></i>
                    <div class="mb-2 text-lg">No records found</div>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>

<!-- ADD DIALOG -->
<p-dialog [(visible)]="addDialog" [style]="{ width: '450px' }" [modal]="true"
    [header]="editId ? 'Edit Version' : 'Add Version'">
    <form [formGroup]="addForm" class="p-4">
        <div class="flex flex-col gap-6">
            <div>
                <label for="releaseDate" class="block font-bold mb-2">Date</label>
                <p-datepicker inputId="releaseDate" formControlName="ReleaseDate" [showIcon]="true" [showButtonBar]="true"
                    placeholder="Enter date" [dateFormat]="'dd-mm-yy'" appendTo="body" (onSelect)="onDateSelect($event)" [style]="{ width: '450px' }">
                </p-datepicker>
                <small class="text-red-500 mt-1" *ngIf="submitted && addForm.controls['ReleaseDate'].invalid">
                    Date is required.
                </small>
            </div>
            <div>
                <label for="version" class="block font-bold mb-2">Version</label>
                <input pInputText id="version" formControlName="Version" class="w-full" placeholder="Enter version" autofocus />
                <small class="text-red-500" *ngIf="submitted && addForm.controls['Version'].invalid">
                    Version is required.
                </small>
            </div>
            <div>
                <label for="details" class="block font-semibold mb-2">Details</label>
                <textarea pInputTextarea rows="3" formControlName="Details" class="w-full"
                    placeholder="Enter details">
                </textarea>
                <small class="text-red-500" *ngIf="submitted && addForm.controls['Details'].invalid">
                    Details is required.
                </small>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2 px-4 pb-3">
            <p-button label="Cancel" icon="pi pi-times" text (click)="closeDialog()"></p-button>
            <p-button label="Save" icon="pi pi-check" (click)="editId ? btnUpdate() : btnSave()"
                [disabled]="addForm.invalid && submitted">
            </p-button>
        </div>
    </ng-template>
</p-dialog>
