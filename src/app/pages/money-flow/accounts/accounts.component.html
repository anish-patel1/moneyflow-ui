<p-table #table [value]="accountData" dataKey="accountId" [tableStyle]="{ 'min-width': 'auto' }"
    [globalFilterFields]="['accountName', 'accountType', 'balance']" [rows]="5" [paginator]="true"
    [rowsPerPageOptions]="[5, 8, 10, 20, 30]" [rowHover]="true">
    <ng-template #caption>
        <div class="flex items-center justify-between gap-2 sm:gap-3">
            <p-iconfield class="flex-1 sm:flex-initial sm:w-72 min-w-0">
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" placeholder="Search accounts..." class="w-full" (input)="search(table, $event)" />
            </p-iconfield>
            <p-button label="New" icon="pi pi-plus" severity="secondary" class="shrink-0" (onClick)="openDialog()" />
        </div>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="accountName">Name
                <p-sortIcon field="accountName" />
            </th>
            <th pSortableColumn="accountType">Type
                <p-sortIcon field="accountType" />
            </th>
            <th pSortableColumn="balance" class="w-36">
                <div class="flex justify-end items-center gap-1">
                    Balance
                    <p-sortIcon field="balance"></p-sortIcon>
                </div>
            </th>
            <th style="width: 5rem"></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-data>
        <tr class="hover-row">
            <td class="font-medium text-color">{{ data.accountName }}</td>
            <td>
                <p-tag 
                    [value]="data.accountType" 
                    [severity]="data.accountType === 'Bank' ? 'info' : (data.accountType === 'FD' ? 'success' : 'warn')"
                    [icon]="data.accountType === 'Bank' ? 'pi pi-building-columns' : (data.accountType === 'FD' ? 'pi pi-lock' : 'pi pi-wallet')">
                </p-tag>
            </td>
            <td class="w-36">
                <div class="text-right font-semibold whitespace-nowrap tabular-nums"
                    [ngClass]="data.balance < 0 ? 'text-red-500' : 'text-color'">
                    {{ data.balance | number:'1.2-2' }}
                </div>
            </td>
            <td>
                <p-menu #menu [model]="items" [popup]="true" appendTo="body"></p-menu>
                <p-button icon="pi pi-ellipsis-h" [text]="true" [rounded]="true" size="small" severity="secondary"
                    (click)="openMenu(menu, $event, data.accountId, data.status)">
                </p-button>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <ng-container *ngIf="isgridloading">
            <tr *ngFor="let _ of [].constructor(5)">
                <td *ngFor="let _ of [].constructor(4)">
                    <p-skeleton width="100%" height="1.25rem"></p-skeleton>
                </td>
            </tr>
        </ng-container>
        <tr *ngIf="!isgridloading">
            <td colspan="4">
                <div class="flex flex-col items-center justify-center p-8 text-color-secondary animate-fade-in">
                    <i class="pi pi-database text-5xl mb-3 opacity-50"></i>
                    <div class="mb-1 text-lg font-medium text-color">No accounts found</div>
                    <p class="text-sm text-color-secondary m-0">Add an account to start tracking your money</p>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>

<!-- ADD DIALOG -->
<p-dialog [(visible)]="addDialog" [modal]="true" [draggable]="false" [resizable]="false" [closable]="true"
    [style]="{ width: '450px', maxWidth: '95vw' }" contentStyleClass="p-0">
    <ng-template pTemplate="header">
        <div class="px-5 py-2">
            <div class="text-lg font-semibold text-color">
                {{ editId ? 'Edit Account' : 'Add Account' }}
            </div>
            <div class="text-sm text-color-secondary mt-1">
                Manage your financial accounts
            </div>
        </div>
    </ng-template>
    <form [formGroup]="addForm" class="px-5 py-4 space-y-5">
        <div>
            <label class="block text-sm font-medium mb-2 text-color">
                Account Name
            </label>
            <input pInputText formControlName="AccountName" class="w-full" placeholder="e.g. HDFC Savings Account"
                autofocus />
            <small class="text-red-500" *ngIf="submitted && addForm.controls['AccountName'].invalid">
                Name is required
            </small>
        </div>
        <div>
            <label class="block text-sm font-medium mb-2 text-color">
                Account Type
            </label>
            <p-dropdown [options]="accountTypeData" optionLabel="name" optionValue="value" formControlName="AccountType"
                placeholder="Select account type" class="w-full" appendTo="body">
            </p-dropdown>
            <small class="text-red-500" *ngIf="submitted && addForm.controls['AccountType'].invalid">
                Type is required
            </small>
        </div>
        <div *ngIf="!editId">
            <div class="flex items-center gap-2">
                <p-checkbox formControlName="EnableOpeningBalance" binary="true" inputId="openingToggle"
                    (onChange)="changeOpBalToggle($event)">
                </p-checkbox>
                <label for="openingToggle" class="text-sm text-color">
                    This account already has money
                </label>
            </div>
        </div>
        <div *ngIf="addForm.get('EnableOpeningBalance')?.value && !editId" class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
            <div>
                <label class="block text-sm font-medium mb-2 text-color">
                    Opening Balance
                </label>
                <p-inputNumber formControlName="OpeningBalance" mode="decimal" [min]="0" [minFractionDigits]="2"
                    [maxFractionDigits]="2" class="w-full" placeholder="e.g. 5000.00">
                </p-inputNumber>
                <small class="text-red-500" *ngIf="submitted && addForm.get('OpeningBalance')?.invalid">
                    Opening balance must be greater than zero.
                </small>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2 text-color">
                    Opening Date
                </label>
                <p-datepicker formControlName="OpeningDate" [showIcon]="true" dateFormat="dd-mm-yy" class="w-full"
                    appendTo="body" [maxDate]="today" (onSelect)="onDateSelect($event)">
                </p-datepicker>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-3 px-5 py-3">
            <p-button label="Cancel" severity="secondary" [text]="true" (click)="closeDialog()">
            </p-button>
            <p-button label="Save" icon="pi pi-check" severity="primary" (click)="editId ? btnUpdate() : btnSave()"
                [disabled]="addForm.invalid">
            </p-button>
        </div>
    </ng-template>
</p-dialog>
