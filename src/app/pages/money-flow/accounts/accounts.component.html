<p-table #table [value]="accountData" dataKey="activityTypeId" [tableStyle]="{ 'min-width': 'auto' }"
    [globalFilterFields]="['accountName', 'accountType']" [rows]="5" [paginator]="true"
    [rowsPerPageOptions]="[5, 8, 10, 20, 30]" [rowHover]="true">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" placeholder="Search..." (input)="search(table, $event)" />
            </p-iconfield>
            <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openDialog()" />
        </div>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="accountName">Name
                <p-sortIcon field="accountName" />
            </th>
            <th pSortableColumn="accountType">Type
                <p-sortIcon field="accountType" />
            </th>
            <th style="width: 5rem">Status</th>
            <th style="width: 5rem"></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-data>
        <tr class="hover-row">
            <td>{{ data.accountName }}</td>
            <td>{{ data.accountType }}</td>
            <td>
                <p-tag [value]="data.statusText" />
            </td>
            <td>
                <p-menu #menu [model]="items" [popup]="true" appendTo="body"></p-menu>
                <p-button icon="pi pi-ellipsis-h" styleClass="p-button-text p-button-rounded p-button-sm"
                    (click)="openMenu(menu, $event, data.accountId, data.status)">
                </p-button>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <ng-container *ngIf="isgridloading">
            <tr *ngFor="let _ of [].constructor(5)">
                <td *ngFor="let _ of [].constructor(4)">
                    <p-skeleton width="100%" height="1.25rem"></p-skeleton>
                </td>
            </tr>
        </ng-container>
        <tr *ngIf="!isgridloading">
            <td colspan="4">
                <div class="flex flex-col items-center justify-center p-6 text-gray-500 animate-fade-in">
                    <i class="pi pi-database text-5xl text-gray-400 mb-3"></i>
                    <div class="mb-2 text-lg">No records found</div>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>

<!-- ADD DIALOG -->
<p-dialog [(visible)]="addDialog" [style]="{ width: '450px' }" [modal]="true"
    [header]="editId ? 'Edit Account' : 'Add Account'">
    <form [formGroup]="addForm" class="p-4">
        <div class="flex flex-col gap-6">
            <div>
                <label for="accountName" class="block font-bold mb-2">Name</label>
                <input pInputText id="accountName" formControlName="AccountName" class="w-full" placeholder="Enter name" autofocus />
                <small class="text-red-500" *ngIf="submitted && addForm.controls['AccountName'].invalid">
                    Name is required.
                </small>
            </div>
            <div>
                <label for="accountType" class="block font-bold mb-2">Type</label>
                <p-dropdown inputId="accountType" [options]="accountTypeData" optionLabel="name"
                    optionValue="value" formControlName="AccountType" [placeholder]="'Select...'"
                    [filter]="false" [showClear]="false" class="w-full" appendTo="body">
                </p-dropdown>
                <small class="text-red-500 mt-1" *ngIf="submitted && addForm.controls['AccountType'].invalid">
                    Type is required.
                </small>
            </div>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2 px-4 pb-3">
            <p-button label="Cancel" icon="pi pi-times" text (click)="closeDialog()"></p-button>
            <p-button label="Save" icon="pi pi-check" (click)="editId ? btnUpdate() : btnSave()"
                [disabled]="addForm.invalid && submitted">
            </p-button>
        </div>
    </ng-template>
</p-dialog>
