<p-table #table [value]="categoryData" dataKey="categoryId" [tableStyle]="{ 'min-width': 'auto' }"
    [globalFilterFields]="['categoryName', 'categoryType']" [rows]="5" [paginator]="true"
    [rowsPerPageOptions]="[5, 8, 10, 20, 30]" [rowHover]="true">
    <ng-template #caption>
        <div class="flex items-center justify-between gap-2 sm:gap-3">
            <p-iconfield class="flex-1 sm:flex-initial sm:w-72 min-w-0">
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" placeholder="Search categories..." class="w-full" (input)="search(table, $event)" />
            </p-iconfield>
            <p-button label="New" icon="pi pi-plus" severity="secondary" class="shrink-0" (onClick)="openDialog()" />
        </div>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="categoryName">Name
                <p-sortIcon field="categoryName" />
            </th>
            <th pSortableColumn="categoryType">Type
                <p-sortIcon field="categoryType" />
            </th>
            <th style="width: 5rem"></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-data>
        <tr class="hover-row">
            <td class="font-medium text-color">{{ data.categoryName }}</td>
            <td>
                <p-tag 
                    [value]="data.categoryType" 
                    [severity]="data.categoryType === 'Income' ? 'success' : 'danger'"
                    [icon]="data.categoryType === 'Income' ? 'pi pi-arrow-down' : 'pi pi-arrow-up'">
                </p-tag>
            </td>
            <td>
                <p-menu #menu [model]="items" [popup]="true" appendTo="body"></p-menu>
                <p-button icon="pi pi-ellipsis-h" [text]="true" [rounded]="true" size="small" severity="secondary"
                    (click)="openMenu(menu, $event, data.categoryId, data.status)">
                </p-button>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <ng-container *ngIf="isgridloading">
            <tr *ngFor="let _ of [].constructor(5)">
                <td *ngFor="let _ of [].constructor(3)">
                    <p-skeleton width="100%" height="1.25rem"></p-skeleton>
                </td>
            </tr>
        </ng-container>
        <tr *ngIf="!isgridloading">
            <td colspan="3">
                <div class="flex flex-col items-center justify-center p-8 text-color-secondary animate-fade-in">
                    <i class="pi pi-database text-5xl mb-3 opacity-50"></i>
                    <div class="mb-1 text-lg font-medium text-color">No categories found</div>
                    <p class="text-sm text-color-secondary m-0">Add a category to organize your transactions</p>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>

<!-- ADD DIALOG -->
<p-dialog [(visible)]="addDialog" [modal]="true" [draggable]="false" [resizable]="false" [closable]="true"
    [style]="{ width: '450px', maxWidth: '95vw' }" contentStyleClass="p-0">
    <ng-template pTemplate="header">
        <div class="px-5 py-2">
            <div class="text-lg font-semibold text-color">
                {{ editId ? 'Edit Category' : 'Add Category' }}
            </div>
            <div class="text-sm text-color-secondary mt-1">
                Manage your income / expense categories
            </div>
        </div>
    </ng-template>
    <form [formGroup]="addForm" class="px-5 py-4 space-y-5">
        <div>
            <label for="categoryName" class="block text-sm font-medium mb-2 text-color">Name</label>
            <input pInputText id="categoryName" formControlName="CategoryName" class="w-full" placeholder="Enter category name" autofocus />
            <small class="text-red-500" *ngIf="submitted && addForm.controls['CategoryName'].invalid">
                Name is required.
            </small>
        </div>
        <div>
            <label for="categoryType" class="block text-sm font-medium mb-2 text-color">Type</label>
            <p-dropdown inputId="categoryType" [options]="categoryTypeData" optionLabel="name"
                optionValue="value" formControlName="CategoryType" [placeholder]="'Select type'"
                [filter]="false" [showClear]="false" class="w-full" appendTo="body">
            </p-dropdown>
            <small class="text-red-500 mt-1" *ngIf="submitted && addForm.controls['CategoryType'].invalid">
                Type is required.
            </small>
        </div>
    </form>
    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-3 px-5 py-3">
            <p-button label="Cancel" severity="secondary" [text]="true" (click)="closeDialog()"></p-button>
            <p-button label="Save" icon="pi pi-check" severity="primary" (click)="editId ? btnUpdate() : btnSave()"
                [disabled]="addForm.invalid && submitted">
            </p-button>
        </div>
    </ng-template>
</p-dialog>
