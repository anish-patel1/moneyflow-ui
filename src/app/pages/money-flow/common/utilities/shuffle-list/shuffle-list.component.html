<p-dialog header="Shuffle Picker" [(visible)]="visible" [modal]="true" [closable]="true" [style]="{ width: '680px' }"
    [breakpoints]="{ '960px': '75vw', '640px': '90vw' }" contentStyleClass="shuffle-dialog-content" (onHide)="stopShuffle()">

    <!-- Controls Toolbar -->
    <div class="flex items-center gap-2 mb-4 flex-wrap">

        <!-- Action buttons -->
        <div class="flex items-center gap-2">
            <p-button *ngIf="!isShuffling" label="Start" icon="pi pi-play-circle" severity="success"
                (onClick)="startShuffle()" [disabled]="isShuffling || items.length === 0" pTooltip="Start shuffle" />
            <p-button *ngIf="isShuffling" label="Stop" icon="pi pi-stop-circle" severity="secondary"
                (onClick)="stopShuffle()" pTooltip="Stop shuffle" />
            <p-button label="Shuffle" icon="pi pi-sync" severity="warn"
                (onClick)="shuffleItems()" [disabled]="isShuffling || items.length < 2" pTooltip="Randomize order" />
            <p-button *ngIf="selectedItem" label="Clear" icon="pi pi-eraser" severity="secondary"
                (onClick)="resetSelection()" pTooltip="Clear selection" />
        </div>

        <!-- Add item input -->
        <div class="flex items-center gap-2 ml-auto">
            <input #addInput type="text" pInputText placeholder="Add name…" [(ngModel)]="newItem"
                (keydown.enter)="addItem()" (keydown.space)="$event.stopPropagation()" [disabled]="isShuffling"
                class="px-3 py-2 rounded-md" />
            <p-button label="Add" icon="pi pi-plus" severity="success"
                (onClick)="addItem()" [disabled]="!newItem.trim() || isShuffling" pTooltip="Add to list" />
        </div>
    </div>

    <!-- List -->
    <div class="overflow-auto rounded-lg p-2 max-h-[30rem]" #listContainer>

        <!-- Empty state -->
        <div *ngIf="items.length === 0" class="flex flex-col items-center justify-center py-12 gap-3 text-muted-color">
            <i class="pi pi-list text-4xl opacity-30"></i>
            <span class="text-sm">No items yet — add some names above to get started</span>
        </div>

        <ul class="p-0 m-0" role="listbox">
            <li *ngFor="let it of items; let i = index; trackBy: trackByIndex" #listItem role="option" tabindex="-1"
                [attr.aria-selected]="selectedItem === it"
                class="shuffle-item flex items-center gap-3 p-3 rounded-md mb-2 border border-surface" [ngClass]="{
                    'bg-surface-hover border-surface-border shadow-md scale-[1.02]': i === highlightedIndex && !selectedItem,
                    'animate-winner': selectedItem === it,
                    'rolling': isShuffling && i === highlightedIndex
                }">

                <!-- Avatar -->
                <div class="flex items-center flex-shrink-0">
                    <div *ngIf="getAvatarUrl(it) as url; else initialsTpl"
                        class="w-10 h-10 rounded-md overflow-hidden border border-surface flex items-center justify-center">
                        <img [src]="url" class="w-full h-full object-cover" alt="" />
                    </div>

                    <ng-template #initialsTpl>
                        <div
                            class="avatar-initials w-10 h-10 rounded-md flex items-center justify-center font-bold text-sm border">
                            {{ getInitials(it) }}
                        </div>
                    </ng-template>
                </div>

                <!-- Label -->
                <div class="flex-1 min-w-0">
                    <ng-container *ngIf="editingIndex !== i; else editTpl">
                        <div class="font-semibold truncate">{{ display(it) }}</div>
                    </ng-container>

                    <ng-template #editTpl>
                        <input #editInput pInputText [(ngModel)]="editingValue" (keydown.enter)="saveEdit(i)"
                            (keydown.escape)="cancelEdit()" (blur)="saveEdit(i)" class="w-full rounded-md px-2 py-1" />
                    </ng-template>
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-1 flex-shrink-0">
                    <button *ngIf="editingIndex !== i" pButton class="p-button-rounded p-button-text"
                        (click)="startEdit(i)" [disabled]="isShuffling || editingIndex !== null" title="Edit">
                        <i class="pi pi-pencil"></i>
                    </button>

                    <button *ngIf="editingIndex === i" pButton class="p-button-rounded p-button-success"
                        (click)="saveEdit(i)" [disabled]="!editingValue.trim()" title="Save">
                        <i class="pi pi-check"></i>
                    </button>

                    <button *ngIf="editingIndex === i" pButton class="p-button-rounded p-button-secondary"
                        (click)="cancelEdit()" title="Cancel">
                        <i class="pi pi-times"></i>
                    </button>

                    <button pButton class="p-button-rounded p-button-danger p-button-text" (click)="removeItem(i)"
                        [disabled]="isShuffling" title="Remove">
                        <i class="pi pi-trash"></i>
                    </button>
                </div>
            </li>
        </ul>
    </div>

    <!-- Selection Result -->
    <div class="mt-4 pt-3 border-t border-surface">

        <!-- Status label -->
        <div class="text-xs font-medium mb-2 flex items-center gap-2">
            <span *ngIf="isShuffling" class="running-label flex items-center gap-1.5">
                <i class="pi pi-spin pi-spinner text-xs"></i> Running…
            </span>
            <span *ngIf="!isShuffling && selectedItem" class="text-muted-color uppercase tracking-wide">
                Winner
            </span>
            <span *ngIf="!isShuffling && !selectedItem" class="text-muted-color">
                No selection yet
            </span>
        </div>

        <!-- Result pill -->
        <div class="w-full flex">
            <div class="selection-pill flex items-center gap-3 rounded-xl px-4 py-2.5 w-full border font-semibold"
                [class.has-selection]="!!selectedItem" [class.opacity-50]="!selectedItem && !isShuffling">
                <i class="pi pi-trophy text-sm" [class.text-primary]="!!selectedItem"
                    [class.text-muted-color]="!selectedItem"></i>
                <span class="flex-1 truncate">
                    {{ selectedItem ? display(selectedItem) : '— awaiting selection —' }}
                </span>
                <p-button [rounded]="true" [text]="true" [icon]="copySuccess ? 'pi pi-check text-green-500' : 'pi pi-copy'"
                    [disabled]="isShuffling || !selectedItem" (onClick)="copySelected()" pTooltip="Copy to clipboard" />
            </div>
        </div>
    </div>

</p-dialog>
