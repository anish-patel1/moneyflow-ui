<p-table #table [value]="transactionData" dataKey="transactionId" [tableStyle]="{ 'min-width': 'auto' }"
    [globalFilterFields]="['transactionDate', 'accountName', 'categoryName', 'transactionType', 'amount']" [rows]="6"
    [rowHover]="true" [scrollable]="true" scrollHeight="70vh">
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <p-iconfield class="w-64">
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" placeholder="Search..." class="w-full"
                        (input)="search(table, $event)" />
                </p-iconfield>

                <p-datepicker [(ngModel)]="selectedDateRange" selectionMode="range" dateFormat="dd-M-yy"
                    iconDisplay="input" placeholder="Select date range" [showIcon]="true"
                    (onSelect)="onDateRangeSelected()" [style]="{ width: '250px' }">
                </p-datepicker>

                <p-button icon="pi pi-filter" severity="secondary" (click)="filterPanel.toggle($event)">
                </p-button>

                <p-popover #filterPanel>
                    <div class="flex flex-col gap-4 w-80">
                        <div>
                            <label class="block mb-1 font-medium">Account</label>
                            <p-dropdown [options]="accountData" optionLabel="accountName" optionValue="accountId"
                                [(ngModel)]="filter.accountId" placeholder="Select account" [filter]="true"
                                [showClear]="true" class="w-full">
                            </p-dropdown>
                        </div>
                        <div>
                            <label class="block mb-1 font-medium">Type</label>
                            <p-dropdown [options]="transactionTypeData" optionLabel="name" optionValue="value"
                                [(ngModel)]="filter.transactionType" placeholder="Select type" [showClear]="true"
                                class="w-full" (onChange)="changeTransactionType($event)">
                            </p-dropdown>
                        </div>
                        <div>
                            <label class="block mb-1 font-medium">Category</label>
                            <p-dropdown [options]="categoryData" optionLabel="categoryName" optionValue="categoryId"
                                [(ngModel)]="filter.categoryId" placeholder="Select category" [filter]="true"
                                [showClear]="true" class="w-full">
                            </p-dropdown>
                        </div>
                        <div class="flex justify-end gap-2 pt-2 border-t border-gray-200 dark:border-gray-700">
                            <p-button label="Clear" severity="secondary" size="small" (click)="clearFilter()" />
                            <p-button label="Apply" severity="primary" size="small"
                                (click)="applyFilter(); filterPanel.hide()" />
                        </div>
                    </div>
                </p-popover>
            </div>
            <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (click)="openDialog()"
                [style]="{ marginRight: '0.25em' }" />
        </div>
    </ng-template>

    <ng-template pTemplate="header">
        <tr>
            <th>Date</th>
            <th>Account</th>
            <th>Category</th>
            <th>Type</th>
            <th>Amount</th>
            <th style="width: 5rem"></th>
        </tr>
    </ng-template>

    <ng-template pTemplate="body" let-data>
        <tr class="hover-row">
            <td>{{ data.transactionDate }}</td>
            <td>{{ data.accountName }}</td>
            <td>{{ data.categoryName }}</td>
            <td>{{ data.transactionType }}</td>
            <td>{{ data.amount }}</td>
            <td>
                <p-menu #menu [model]="items" [popup]="true" appendTo="body"></p-menu>
                <p-button icon="pi pi-ellipsis-h" styleClass="p-button-text p-button-rounded p-button-sm"
                    (click)="openMenu(menu, $event, data.transactionId)">
                </p-button>
            </td>
        </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
        <ng-container *ngIf="isgridloading">
            <tr *ngFor="let _ of [].constructor(5)">
                <td *ngFor="let _ of [].constructor(6)">
                    <p-skeleton width="100%" height="1.25rem"></p-skeleton>
                </td>
            </tr>
        </ng-container>
        <tr *ngIf="!isgridloading">
            <td colspan="6">
                <div class="flex flex-col items-center justify-center p-6 text-gray-500 animate-fade-in">
                    <i class="pi pi-database text-5xl text-gray-400 mb-3"></i>
                    <div class="mb-2 text-lg">No records found</div>
                </div>
            </td>
        </tr>
    </ng-template>
</p-table>

<!-- ADD DRAWER -->
<p-dialog [(visible)]="addDialog" [modal]="true" [draggable]="false" [resizable]="false" [closable]="true"
    [style]="{ width: '520px', maxWidth: '95vw' }" contentStyleClass="p-0 overflow-hidden">
    <ng-template pTemplate="header">
        <div class="p-3 bg-transparent">
            <div class="text-xl font-semibold tracking-tight">
                {{ editId ? 'Edit Transaction' : 'Add Transaction' }}
            </div>
            <div class="text-sm text-gray-400 mt-1">
                Record your income or expense
            </div>
        </div>
    </ng-template>

    <form [formGroup]="addForm" class="px-3 space-y-6">
        <div>
            <label class="block text-sm font-medium mb-3">Amount</label>
            <div class="relative">
                <p-inputNumber formControlName="Amount" mode="decimal" [minFractionDigits]="2" [maxFractionDigits]="2"
                    inputStyleClass="pl-10 w-full text-2xl font-semibold" class="w-full" placeholder="e.g. 1500.00">
                </p-inputNumber>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-sm font-medium mb-2">Date</label>
                <p-datepicker formControlName="TransactionDate" [showIcon]="true" dateFormat="dd-mm-yy" appendTo="body"
                    class="w-full" placeholder="DD-MM-YYYY" (onSelect)="onDateSelect($event)">
                </p-datepicker>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Account</label>
                <p-dropdown [options]="accountData" optionLabel="accountName" optionValue="accountId"
                    formControlName="AccountId" [filter]="true" placeholder="Select account" class="w-full"
                    appendTo="body">
                </p-dropdown>
            </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label class="block text-sm font-medium mb-2">Type</label>
                <p-dropdown [options]="transactionTypeData" optionLabel="name" optionValue="value"
                    formControlName="TransactionType" placeholder="Select type" class="w-full" appendTo="body"
                    (onChange)="changeTransactionType($event)">
                </p-dropdown>
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Category</label>
                <p-dropdown [options]="categoryData" optionLabel="categoryName" optionValue="categoryId"
                    formControlName="CategoryId" [filter]="true" placeholder="Select category" class="w-full"
                    appendTo="body">
                </p-dropdown>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium mb-2">Description</label>
            <textarea pInputTextarea rows="3" formControlName="Description" class="w-full"
                placeholder="Add a short note (optional)">
            </textarea>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <div class="px-3 py-3 bg-transparent flex justify-end gap-3">
            <p-button label="Cancel" severity="secondary" text (click)="closeDialog()">
            </p-button>

            <p-button label="Save Transaction" icon="pi pi-check" (click)="editId ? btnUpdate() : btnSave()"
                [disabled]="addForm.invalid" [loading]="isSaving">
            </p-button>
        </div>
    </ng-template>
</p-dialog>
